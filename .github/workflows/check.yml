name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm run check
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
